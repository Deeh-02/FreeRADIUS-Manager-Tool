# Four containers on one private network:
#   frontend (nginx + built Vue app, :8081) --/api--> backend (Go API) --> postgres
#   freeradius (UDP 1812/1813) reads and writes the SAME postgres database.
# Only the host ports published below are reachable from outside; postgres is not published
# and the API port is bound to 127.0.0.1 (the UI reaches it through nginx).
#
# Secrets have no defaults: `docker compose` refuses to start until .env sets DB_PASSWORD,
# JWT_SECRET and RADIUS_SECRET. Run ./setup.sh (it generates them) or copy .env.example.
#
# Optional HTTPS: set DOMAIN and COMPOSE_PROFILES=https in .env, point that name at this
# server and open ports 80/443. Caddy then fetches a certificate and serves the UI on
# https://DOMAIN.

x-tz: &tz
  # One timezone for every container. FreeRADIUS reads the Expiration date in its local
  # time, so this decides at what midnight unpaid customers are cut off.
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:15-alpine
    container_name: radius_postgres
    environment:
      <<: *tz
      POSTGRES_DB: ${DB_NAME:-radius}
      POSTGRES_USER: ${DB_USER:-radius_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (run ./setup.sh)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Files in docker-entrypoint-initdb.d run only when the data volume is EMPTY (first
      # start). On an existing database, deploy-update.sh applies new migrations instead.
      # 008_network_scanner.sql is not mounted: init-db.sql already contains it.
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./migrations/009_billing.sql:/docker-entrypoint-initdb.d/02-billing.sql:ro
      - ./migrations/010_missing_schema.sql:/docker-entrypoint-initdb.d/03-missing-schema.sql:ro
      - ./migrations/011_billing_integrity.sql:/docker-entrypoint-initdb.d/04-billing-integrity.sql:ro
      - ./migrations/012_kes_and_customer_grace.sql:/docker-entrypoint-initdb.d/05-kes-and-grace.sql:ro
      - ./migrations/013_trial_days.sql:/docker-entrypoint-initdb.d/06-trial-days.sql:ro
    networks:
      - radius-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-radius_user} -d ${DB_NAME:-radius}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  freeradius:
    build: ./freeradius
    container_name: radius_freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      <<: *tz
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radius}
      DB_USER: ${DB_USER:-radius_user}
      DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD in .env (run ./setup.sh)}
      # Fallback secret for routers not registered on the NAS Devices page (clients.conf).
      RADIUS_SECRET: ${RADIUS_SECRET:?set RADIUS_SECRET in .env (run ./setup.sh)}
    volumes:
      - radius_logs:/var/log/freeradius
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - radius-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: radius_backend
    environment:
      <<: *tz
      # Same timezone for the database session, so CURRENT_DATE matches the local day.
      PGTZ: ${TZ:-UTC}
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-radius_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (run ./setup.sh)}
      DB_NAME: ${DB_NAME:-radius}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (run ./setup.sh)}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-1h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-168h}
      RADIUS_HOST: freeradius
      RADIUS_AUTH_PORT: 1812
      RADIUS_SECRET: ${RADIUS_SECRET:?set RADIUS_SECRET in .env (run ./setup.sh)}
      # Fixed: the Dockerfile healthcheck and the nginx proxy_pass both use 8088.
      WEB_PORT: 8088
      # Optional: required by the first-run setup wizard when set.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Proxies allowed to set X-Forwarded-For (default: loopback + Docker networks).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Only if a browser app on another origin calls the API (comma-separated origins).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      RATE_LIMIT: ${RATE_LIMIT:-300}
      BRUTE_FORCE_ATTEMPTS: ${BRUTE_FORCE_ATTEMPTS:-5}
      BRUTE_FORCE_LOCKOUT: ${BRUTE_FORCE_LOCKOUT:-15}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-3600}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-}
      NMAP_MAX_PREFIX: ${NMAP_MAX_PREFIX:-18}
      NMAP_MAX_PORTSCAN_HOSTS: ${NMAP_MAX_PORTSCAN_HOSTS:-512}
      GEOIP_API_URL: ${GEOIP_API_URL:-}
      # Webhooks to private/LAN addresses are refused unless this is true.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@radius-manager.local}
      SMS_GATEWAY: ${SMS_GATEWAY:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_AUTH_HEADER: ${SMS_AUTH_HEADER:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SMS_BODY_TEMPLATE: ${SMS_BODY_TEMPLATE:-}
      SMS_CONTENT_TYPE: ${SMS_CONTENT_TYPE:-}
      # Dumps go to ./backups on the host (see the volume below).
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    ports:
      # Loopback only: browsers use the UI on 8081, which proxies /api to here.
      - "127.0.0.1:8088:8088"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      freeradius:
        condition: service_started
    networks:
      - radius-network
    # Lets nmap (network scanner) use raw sockets for ARP/ICMP discovery.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time; nginx proxies /api/ to the backend.
        VITE_API_URL: /api/v1
    container_name: radius_frontend
    environment:
      <<: *tz
    ports:
      - "${UI_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - radius-network
    restart: unless-stopped

  # HTTPS in front of the UI (optional, see the top of this file).
  caddy:
    image: caddy:2.8-alpine
    container_name: radius_caddy
    profiles: ["https"]
    environment:
      <<: *tz
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - radius-network
    restart: unless-stopped

networks:
  radius-network:
    driver: bridge

# postgres_data holds ALL business data (users, invoices, payments, accounting). Removing it
# (`docker compose down -v`) deletes everything and re-runs the init scripts. The backend's
# backup_database task writes daily dumps to ./backups; copy them off this server.
volumes:
  postgres_data:
    driver: local
  radius_logs:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
