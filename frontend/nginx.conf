# The M-Pesa callback addresses end in a secret (/api/v1/pay/<kind>/<secret>); the access log
# gets it masked, or anyone reading the log could post fake payment confirmations.
map $request_uri $loggable_uri {
    ~^(?<pre>/api/v1/pay/[a-z]+/)[^/?]+(?<post>.*)$  "${pre}REDACTED${post}";
    default                                           $request_uri;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log redacted;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Request bodies up to the backend's own 20 MB cap (CSV import).
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx drops the server-level add_header lines in any location that sets its own, so
    # every location includes the security headers itself.

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite puts a content hash in their names)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API requests go to the backend (`backend` is the compose service name).
    # X-Forwarded-For is appended to; the backend reads it right-to-left and only trusts
    # entries added by TRUSTED_PROXIES (default: loopback and Docker networks), so a client
    # cannot pick its own IP. Buffering is off so the live-stats event stream is not held
    # back, and the long read timeout keeps that stream open.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # M-Pesa callbacks: as /api/, but nginx's error log, which cannot mask, gets only critical
    # errors. An upstream error (backend restarting) would write the full callback address,
    # secret included. The API logs these requests itself, masked.
    location /api/v1/pay/ {
        include /etc/nginx/snippets/security-headers.conf;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
