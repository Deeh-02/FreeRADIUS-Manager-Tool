# PostgreSQL queries for FreeRADIUS 3.x (rlm_sql).
#
# FreeRADIUS 3 reads accounting queries ONLY from the `accounting { type { ... } }` block
# below. The FreeRADIUS 2 key names (accounting_start_query, accounting_update_query, ...)
# are silently ignored by version 3, which is why accounting never reached radacct before
# this file was rewritten. The accounting/post-auth structure follows the stock
# raddb/mods-config/sql/main/postgresql/queries.conf of FreeRADIUS 3.2, checked against
# the radacct columns in init-db.sql.

# This MUST be set — without it %{SQL-User-Name} expands to empty string.
sql_user_name = "%{User-Name}"

event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-%l}"
event_timestamp = "TO_TIMESTAMP(${event_timestamp_epoch})"

class {
	column_name =
	packet_xlat =
	reply_xlat =
}

# Read NAS clients from database (only rows with status = 'active'; loaded at startup, so
# adding a NAS in the web UI needs a FreeRADIUS restart before it is accepted. The static
# ranges in clients.conf are what let Docker/private-network devices work in the meantime.)
client_query = "\
	SELECT id, nasname, shortname, type, secret, server \
	FROM nas \
	WHERE status = 'active'"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

# Simultaneous-Use (device limit) counts the user's open radacct rows. Sessions that started
# before the NAS last rebooted (Accounting-On, recorded in nasreload) are not counted.
simul_count_query = "\
	SELECT COUNT(radacctid) \
	FROM ${acct_table1} a \
	LEFT OUTER JOIN nasreload n USING (nasipaddress) \
	WHERE a.username = '%{SQL-User-Name}' \
	AND a.acctstoptime IS NULL \
	AND (a.acctstarttime > n.reloadtime OR n.reloadtime IS NULL)"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	column_list = "\
		acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, \
		acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, acctauthentic, \
		connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, \
		calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol, \
		framedipaddress, framedipv6address, framedipv6prefix, framedinterfaceid, \
		delegatedipv6prefix ${..class.column_name}"

	type {
		# NAS rebooted: close everything it had open and remember when.
		accounting-on {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					acctstoptime = ${....event_timestamp}, \
					acctupdatetime = ${....event_timestamp}, \
					acctsessiontime = (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM (acctstarttime))), \
					acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE acctstoptime IS NULL \
				AND nasipaddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND acctstarttime <= ${....event_timestamp}"

			query = "\
				INSERT INTO nasreload (nasipaddress, reloadtime) \
				VALUES ('%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', ${....event_timestamp}) \
				ON CONFLICT (nasipaddress) DO UPDATE SET reloadtime = ${....event_timestamp}"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		start {
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES(\
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					NULLIF('%{Realm}', ''), \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
					'%{NAS-Port-Type}', \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULL, \
					0, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					NULL, \
					0, \
					0, \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					NULLIF('%{Framed-IP-Address}', '')::inet, \
					NULLIF('%{Framed-IPv6-Address}', '')::inet, \
					NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
					NULLIF('%{Framed-Interface-Id}', ''), \
					NULLIF('%{Delegated-IPv6-Prefix}', '')::inet \
					${....class.packet_xlat}) \
				ON CONFLICT (acctuniqueid) DO UPDATE \
				SET \
					acctstarttime = ${....event_timestamp}, \
					acctupdatetime = ${....event_timestamp}, \
					connectinfo_start = '%{Connect-Info}' \
				WHERE ${....acct_table1}.acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND ${....acct_table1}.acctstoptime IS NULL"
		}

		# Refreshes usage and acctupdatetime mid-session. If no row exists yet (the Start was
		# lost), the second query creates one so the session is still tracked.
		interim-update {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet, \
					framedipv6address = NULLIF('%{Framed-IPv6-Address}', '')::inet, \
					framedipv6prefix = NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
					framedinterfaceid = NULLIF('%{Framed-Interface-Id}', ''), \
					delegatedipv6prefix = NULLIF('%{Delegated-IPv6-Prefix}', '')::inet, \
					acctsessiontime = %{%{Acct-Session-Time}:-NULL}, \
					acctinterval = (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM (COALESCE(acctupdatetime, acctstarttime)))), \
					acctupdatetime = ${....event_timestamp}, \
					acctinputoctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					acctoutputoctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint) \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"

			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES(\
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					NULLIF('%{Realm}', ''), \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
					'%{NAS-Port-Type}', \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					NULL, \
					%{%{Acct-Session-Time}:-NULL}, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					NULL, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					NULLIF('%{Framed-IP-Address}', '')::inet, \
					NULLIF('%{Framed-IPv6-Address}', '')::inet, \
					NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
					NULLIF('%{Framed-Interface-Id}', ''), \
					NULLIF('%{Delegated-IPv6-Prefix}', '')::inet \
					${....class.packet_xlat}) \
				ON CONFLICT (acctuniqueid) DO NOTHING"
		}

		stop {
			query = "\
				UPDATE ${....acct_table2} \
				SET \
					acctstoptime = ${....event_timestamp}, \
					acctupdatetime = ${....event_timestamp}, \
					acctsessiontime = COALESCE(%{%{Acct-Session-Time}:-NULL}, \
						(${....event_timestamp_epoch} - EXTRACT(EPOCH FROM (acctstarttime)))), \
					acctinputoctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					acctoutputoctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					acctterminatecause = '%{Acct-Terminate-Cause}', \
					framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet, \
					framedipv6address = NULLIF('%{Framed-IPv6-Address}', '')::inet, \
					framedipv6prefix = NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
					framedinterfaceid = NULLIF('%{Framed-Interface-Id}', ''), \
					delegatedipv6prefix = NULLIF('%{Delegated-IPv6-Prefix}', '')::inet, \
					connectinfo_stop = '%{Connect-Info}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
				AND acctstoptime IS NULL"

			query = "\
				INSERT INTO ${....acct_table1} \
					(${...column_list}) \
				VALUES(\
					'%{Acct-Session-Id}', \
					'%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', \
					NULLIF('%{Realm}', ''), \
					'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
					'%{NAS-Port-Type}', \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, \
					${....event_timestamp}, \
					NULLIF('%{Acct-Session-Time}', '')::bigint, \
					'%{Acct-Authentic}', \
					'%{Connect-Info}', \
					NULL, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + \
						'%{%{Acct-Output-Octets}:-0}'::bigint), \
					'%{Called-Station-Id}', \
					'%{Calling-Station-Id}', \
					'%{Acct-Terminate-Cause}', \
					'%{Service-Type}', \
					'%{Framed-Protocol}', \
					NULLIF('%{Framed-IP-Address}', '')::inet, \
					NULLIF('%{Framed-IPv6-Address}', '')::inet, \
					NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
					NULLIF('%{Framed-Interface-Id}', ''), \
					NULLIF('%{Delegated-IPv6-Prefix}', '')::inet \
					${....class.packet_xlat}) \
				ON CONFLICT (acctuniqueid) DO NOTHING"
		}

		# Status types FreeRADIUS has no special handling for: acknowledge only.
		accounting {
			query = "SELECT true"
		}
	}
}

# Post-auth logging. Unlike the stock query, the password the user typed is NOT stored.
post-auth {
	query = "\
		INSERT INTO ${..postauth_table} (username, pass, reply, calledstationid, callingstationid, authdate, nasipaddress) \
		VALUES ('%{SQL-User-Name}', '', '%{reply:Packet-Type}', \
		        '%{Called-Station-Id}', '%{Calling-Station-Id}', \
		        NOW(), \
		        NULLIF('%{NAS-IP-Address}', '')::inet)"
}
