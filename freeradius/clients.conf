# FreeRADIUS clients.conf
# RADIUS_SECRET_PLACEHOLDER is replaced by init.sh at container startup.
#
# These blocks accept ANY device in the Docker ranges (172.16.0.0/12) and the private
# ranges 10.0.0.0/8 and 192.168.0.0/16 using ONE shared secret (RADIUS_SECRET). That keeps
# the backend's own test probes and typical LAN access points working with no per-device
# setup, but it means any host on those networks that knows the secret can send
# authentication/accounting requests. For production, prefer one `nas` row per router with
# its own secret (NAS Devices page) and remove the ranges you do not use from this file.
#
# require_message_authenticator = auto: a client that sends Message-Authenticator once must
# keep sending it, which blocks the BlastRADIUS forgery (CVE-2024-3596) for modern NAS
# firmware while still accepting older devices. The API's own probes always include it. Set
# "yes" for a client once you know all its devices send it.

client localhost {
    ipaddr    = 127.0.0.1
    secret    = RADIUS_SECRET_PLACEHOLDER
    shortname = localhost
    nastype   = other
    require_message_authenticator = auto
    limit_proxy_state = auto
}

client docker {
    ipaddr    = 172.16.0.0/12
    secret    = RADIUS_SECRET_PLACEHOLDER
    shortname = docker
    nastype   = other
    require_message_authenticator = auto
    limit_proxy_state = auto
}

client private_10 {
    ipaddr    = 10.0.0.0/8
    secret    = RADIUS_SECRET_PLACEHOLDER
    shortname = private-10
    nastype   = other
    require_message_authenticator = auto
    limit_proxy_state = auto
}

client private_192 {
    ipaddr    = 192.168.0.0/16
    secret    = RADIUS_SECRET_PLACEHOLDER
    shortname = private-192
    nastype   = other
    require_message_authenticator = auto
    limit_proxy_state = auto
}
